name: pages
on:
  push:
    branches: [main]
    paths: ["arc/docs/**", "near/docs/**", ".github/workflows/arc-pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Upload and deploy are separate jobs: in one job the deploy can look for the
  # artifact before the upload is visible and fail.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The Arc ledger keeps the site root; the NEAR page sits under /near/.
      - run: |
          mkdir -p _site/near
          cp -r arc/docs/. _site/
          cp -r near/docs/. _site/near/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
