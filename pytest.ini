[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::pydantic.PydanticDeprecatedSince20
    # web3 7.x's legacy_websocket.py imports websockets.legacy (deprecated in
    # websockets 14). We never use web3's websocket providers (gateway/base.py
    # is direct JSON-RPC via httpx) — third-party noise, safe to ignore.
    # Remove once web3 drops the legacy provider.
    ignore:websockets\.legacy is deprecated:DeprecationWarning

# Future: once the agentpay SDK pyproject.toml work lands, this config can
# move to [tool.pytest.ini_options] in pyproject.toml and pytest.ini can
# be deleted. Standalone for now to avoid conflicting with in-flight edits.
